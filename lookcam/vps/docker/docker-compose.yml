# The whole VPS side of the LookCam stack, in one command:
#
#   cd vps/docker && cp .env.example .env && nano .env
#   docker compose up -d                       # mediamtx + transcode + web
#   docker compose --profile caddy up -d       # ...plus HTTPS on $DOMAIN
#
# Everything is `restart: unless-stopped`, so containers come back after a crash,
# an OOM kill, or a reboot (as long as the Docker daemon is enabled at boot:
# `sudo systemctl enable docker`).
#
# Every service carries `mem_limit` + `mem_swappiness: 1`. The limit stops one
# runaway container taking the host with it; the swappiness is what makes the
# limit real on this VPS, whose kernel is cgroup v1 without swap accounting
# (no memory.memsw.limit_in_bytes), so mem_limit alone bounds RAM but lets a
# container spill into the host's swapfile without limit and still reach a
# global OOM, just slowly. Near 0 the cgroup won't swap: it hits its ceiling
# and is OOM-killed alone.
#
# It is 1 and not 0 deliberately. Compose serializes this field with omitempty,
# so a literal 0 is Go's zero value and is dropped before it ever reaches the
# daemon — `docker compose config` doesn't even echo it back, and the container
# silently starts at the host default of 60. 1 survives, and swaps only under
# extreme pressure. Verified with
#   docker inspect <c> --format '{{.HostConfig.MemorySwappiness}}'
# and against the cgroup itself at
#   /sys/fs/cgroup/memory/docker/<id>/memory.swappiness
#
# Limits are sized off observed steady state with an order of magnitude of
# headroom — they fire on a genuine runaway, never on normal load.
#
# Credentials live ONLY in .env. MediaMTX reads them via its documented
# MTX_<PARAM> env overrides, so vps/mediamtx.yml keeps its CHANGE_ME placeholders
# and never has to hold a real password.

name: lookcam

services:
  # ---------------------------------------------------------------- ingest ---
  # Receives the capture box's push, records segments, and re-serves the stream.
  mediamtx:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
    # Steady state is ~20MB — it muxes to disk rather than buffering in RAM.
    # 256m is an order of magnitude of headroom and still leaves the box room.
    mem_limit: 256m
    mem_swappiness: 1
    working_dir: /                     # so the config's ./recordings == /recordings
    volumes:
      - ../mediamtx.yml:/mediamtx.yml:ro
      - ${RECORDINGS_DIR:-./recordings}:/recordings
    ports:
      # Only the ingest ports are published. RTSP/HLS/playback stay on the
      # compose network, reachable by the web + transcode containers only.
      - "${SRT_PORT:-8890}:8890/udp"   # SRT — MODE=copy (the phone's path)
      # RTMP ingest is only used by MODE=h264. Left commented out so the stack
      # can't fail to start over a port 1935 clash it never needed.
      # - "${RTMP_PORT:-1935}:1935"
    environment:
      # Bind to all interfaces *inside the container*; exposure is decided by the
      # `ports:` list above, not by the bind address as on a bare-metal install.
      MTX_RTSPADDRESS: ":8554"
      MTX_HLSADDRESS: ":8888"
      MTX_PLAYBACKADDRESS: ":9996"
      # Credentials, injected over the yml's placeholders.
      MTX_AUTHINTERNALUSERS_0_USER: ${PUBLISH_USER:-publisher}
      MTX_AUTHINTERNALUSERS_0_PASS: ${PUBLISH_PASS:?set PUBLISH_PASS in .env}
      MTX_AUTHINTERNALUSERS_1_USER: ${VIEW_USER:-viewer}
      MTX_AUTHINTERNALUSERS_1_PASS: ${VIEW_PASS:?set VIEW_PASS in .env}
      MTX_PATHS_CAM1_RECORDDELETEAFTER: ${RECORD_KEEP:-24h}

  # ------------------------------------------------------------- transcode ---
  # MODE=copy only: the capture box pushes H.265 (which browsers can't play), so
  # republish it as H.264. Not needed with MODE=h264 — then run:
  #   docker compose up -d --scale transcode=0
  transcode:
    build:
      context: ../..
      dockerfile: vps/docker/Dockerfile.transcode
    restart: unless-stopped
    # ffmpeg holding a 1080p pipeline. Steady state is ~37MB, but a stream
    # re-negotiation can spike it, so this is deliberately loose — it exists to
    # stop a runaway decode taking the host down, not to police normal use.
    mem_limit: 512m
    mem_swappiness: 1
    depends_on: [mediamtx]
    environment:
      MTX_HOST: mediamtx              # service name on the compose network
      STREAM_KEY: ${STREAM_KEY:-cam1}
      PUBLISH_USER: ${PUBLISH_USER:-publisher}
      PUBLISH_PASS: ${PUBLISH_PASS:?}
      VIEW_USER: ${VIEW_USER:-viewer}
      VIEW_PASS: ${VIEW_PASS:?}
      BITRATE: ${BITRATE:-2000k}
      # Keyframe interval — the dominant latency term in the stack. Must stay
      # equal to hlsSegmentDuration in vps/mediamtx.yml.
      GOP_SECONDS: ${GOP_SECONDS:-1}
      FPS: ${FPS:-15}
      PRESET: ${PRESET:-veryfast}

  # ------------------------------------------------------------------- web ---
  # Password-gated gateway + SPA. Proxies MediaMTX, which is why MediaMTX needs
  # no public HTTP port of its own.
  web:
    # Built rather than plain oven/bun because /api/snapshot.jpg needs ffmpeg to
    # decode a still frame (MediaMTX has no image endpoint).
    build:
      context: ../../web
    restart: unless-stopped
    depends_on: [mediamtx]
    working_dir: /app
    command: bun run server.ts
    # A ceiling, so a runaway here can never take the host with it. On
    # 2026-07-30 the history DVR asked /api/clip for hour-long stretches, the
    # proxy buffered ~1GB of video (Bun's response writer is eager — see
    # MAX_CLIP_S in server.ts), and the kernel OOM-killer ran on a 2GB box with
    # no swap: it killed this container twice and took every other service on
    # the machine down with it. Inside a limit, only this dies, and
    # `restart: unless-stopped` puts it straight back.
    #
    # Steady state is ~25MB; a clip hand-over peaks near 80MB; /api/snapshot.jpg
    # forks an ffmpeg that decodes 1080p in this same cgroup. 512m is roomy for
    # all three at once and still a quarter of the box.
    mem_limit: 512m
    mem_swappiness: 1
    volumes:
      - ../../web:/app:ro          # edit the SPA without rebuilding
    ports:
      # Bound to localhost: put Caddy (host or the profile below) in front for
      # HTTPS. Change to "${WEB_PORT:-8090}:8080" only to expose it directly.
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    environment:
      PORT: 8080
      MTX_HOST: mediamtx
      MTX_HLS_PORT: 8888
      MTX_PLAYBACK_PORT: 9996
      STREAM_PATH: ${STREAM_KEY:-cam1}
      MTX_VIEW_USER: ${VIEW_USER:-viewer}
      MTX_VIEW_PASS: ${VIEW_PASS:?}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: "${SESSION_SECRET:?generate one with openssl rand -hex 32}"
      SESSION_HOURS: ${SESSION_HOURS:-720}
      MTX_RTSP_PORT: 8554
      SNAPSHOT_TOKEN: ${SNAPSHOT_TOKEN:-}    # lets the assignment reader pull stills
      # The document server, for the Adri tabs. It joins THIS network (see the
      # evens stack's compose file), so the browser never talks to it directly —
      # which matters, because that server has no password and this one does.
      EVENS_URL: ${EVENS_URL:-http://evens:8787}
      # Sending a message to the glasses is gated on the document server, and
      # this process is the only thing that holds the token — so "logged into
      # this app" is the only way to put text on someone's face. Must equal
      # MESSAGE_TOKEN in the evens stack's .env.
      MESSAGE_TOKEN: ${MESSAGE_TOKEN:-}

  # ------------------------------------------------------------ assignment ---
  # Opt-in: `docker compose --profile assignment up -d`. Reads the assignment on
  # the desk out of the live stream via Gemini. Needs GEMINI_API_KEY in .env.
  # Left out of the default set so the camera stack never depends on it.
  assignment:
    build:
      context: ../../assignment
    restart: unless-stopped
    # ~24MB steady; the peaks are snapshot buffers on their way to Gemini.
    mem_limit: 384m
    mem_swappiness: 1
    profiles: [assignment]
    depends_on: [mediamtx, web]
    ports:
      # Published on all interfaces so the glasses' document server (evens/) can
      # reach it from off-box. API_TOKEN is the gate — but this is plain HTTP,
      # so the token crosses the network in the clear. Set
      # ASSIGNMENT_BIND=127.0.0.1 in .env to keep it local (and reach it over an
      # SSH tunnel) if that matters to you.
      - "${ASSIGNMENT_BIND:-0.0.0.0}:${ASSIGNMENT_PORT:-8091}:8091"
    volumes:
      - assignment_data:/app/data      # state.json survives restarts + rebuilds
    environment:
      PORT: 8091
      # Frames come from the gateway's snapshot API — one service owns stream
      # access. (Clear SNAPSHOT_URL to fall back to direct RTSP below.)
      SNAPSHOT_URL: http://web:8080/api/snapshot.jpg
      SNAPSHOT_TOKEN: ${SNAPSHOT_TOKEN:?set SNAPSHOT_TOKEN in .env}
      RTSP_URL: rtsp://${VIEW_USER:-viewer}:${VIEW_PASS:?}@mediamtx:8554/${STREAM_KEY:-cam1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      # The Gemini rungs, in order. Each is tried only when the one above it
      # 404s / rate-limits / 5xx's or returns something unusable. GEMINI_MODELS
      # (comma-separated) overrides all three at once.
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_MODEL_FALLBACK: ${GEMINI_MODEL_FALLBACK:-gemini-3.5-flash-lite}
      GEMINI_MODEL_FALLBACK_2: ${GEMINI_MODEL_FALLBACK_2:-gemini-3.1-flash-lite}
      # The backup PROVIDER, tried only after BOTH Gemini models have failed. A
      # second Google model is no help against an outage at Google, a revoked key
      # or a region-wide 429 — which are the failures that leave a camera reading
      # nothing at all. Unset the key and the reader behaves as it did before.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-medium-latest}
      MISTRAL_MODEL_FALLBACK: ${MISTRAL_MODEL_FALLBACK:-mistral-small-2506}
      API_TOKEN: ${ASSIGNMENT_TOKEN:?set ASSIGNMENT_TOKEN in .env}
      # Settle time AFTER the model answers, before the next frame is grabbed —
      # the loop is sequential, so this is not a fixed capture cadence.
      INTERVAL_MS: ${ASSIGNMENT_INTERVAL_MS:-2500}
      MAX_CAPTURES: ${ASSIGNMENT_MAX_CAPTURES:-40}   # spend ceiling per job

      # A manual snapshot batch goes to a Claude routine before it goes to the
      # models above: the operator framed those images themselves, so it is pure
      # transcription and worth a stronger reader. Leave either of these empty
      # and batches read exactly as they did before, on the chain alone.
      #
      # The token is the routine's own API-trigger token (routine → pencil →
      # Select a trigger → API → Generate token). It can fire that one routine
      # and nothing else, which is why it is safe to keep in a .env.
      READ_ROUTINE_ID: ${READ_ROUTINE_ID:-}
      READ_ROUTINE_TOKEN: ${READ_ROUTINE_TOKEN:-}
      # How long to wait for an agent to claim before the chain takes over. A
      # cloud session spends ~30-60s booting, so this cannot be short.
      READ_CLAIM_TIMEOUT_MS: ${READ_CLAIM_TIMEOUT_MS:-150000}
      # And how long a claimed read may then take.
      READ_SUBMIT_TIMEOUT_MS: ${READ_SUBMIT_TIMEOUT_MS:-600000}

  # ----------------------------------------------------------------- caddy ---
  # Optional, opt-in: `docker compose --profile caddy up -d`. Gets a Let's
  # Encrypt cert for $DOMAIN automatically. Skip it if you already run a
  # reverse proxy on the host — then just point that at 127.0.0.1:${WEB_PORT}.
  caddy:
    image: caddy:2
    restart: unless-stopped
    # ~12MB. It streams SSE with flush_interval -1 rather than buffering, so it
    # has no growth path — but it fronts every domain, so cap it anyway: if the
    # box is ever under pressure, this is the last thing that should be chosen.
    mem_limit: 128m
    mem_swappiness: 1
    profiles: [caddy]
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                # certs — losing this re-triggers ACME
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, or run without --profile caddy}
      # Optional second vhost for the assignment reader. The literal default is
      # repeated here rather than left to the Caddyfile, so the value is never
      # an empty string — an empty site address is a Caddy startup error.
      ASSIGNMENT_DOMAIN: ${ASSIGNMENT_DOMAIN:-assignment.localhost}
      # Vhost for the Even Realities document server, which is deployed from its
      # own repo onto this stack's network. Unset = no route, no ACME attempt.
      EVENS_DOMAIN: ${EVENS_DOMAIN:-evens.localhost}

volumes:
  caddy_data:
  caddy_config:
  assignment_data:
