<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Camera</title>
<!-- hls.js for live playback. Self-host it if you prefer no CDN: download
     hls.min.js next to this file and change the src to "/live/../hls.min.js"
     via a static route, or vendor it into the gateway. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0f12; color: #e7e9ee;
         font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 18px;
           border-bottom: 1px solid #23262d; position: sticky; top: 0; background: #0d0f12; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 6px; }
  .tab { padding: 7px 14px; border-radius: 8px; border: 1px solid #23262d; background: #14171c;
         color: #c7ccd6; cursor: pointer; font-size: 14px; }
  .tab.active { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .grow { flex: 1; }
  a.logout { color: #8b909a; font-size: 13px; text-decoration: none; }
  a.logout:hover { color: #e7e9ee; }
  main { padding: 18px; max-width: 1100px; margin: 0 auto; }
  video { width: 100%; background: #000; border-radius: 12px; aspect-ratio: 16/9; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; display: inline-block;
              margin-right: 6px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
  input[type=date] { padding: 8px 10px; border-radius: 8px; border: 1px solid #2b2f37;
                     background: #14171c; color: #e7e9ee; font-size: 14px; }
  button.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #2b2f37; background: #14171c;
               color: #e7e9ee; cursor: pointer; font-size: 14px; }
  button.btn:hover { border-color: #3b82f6; }
  button.golive { font-weight: 600; color: #f87171; border-color: #3a2426; }
  button.golive.behind { background: #ef4444; color: #fff; border-color: #ef4444; }
  /* Always-on latency readout. Fixed min-width + tabular figures so the row
     doesn't twitch as the number changes twice a second. */
  .lag { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 96px;
         padding: 5px 9px; border-radius: 7px; border: 1px solid #2b2f37;
         background: #14171c; color: #8b909a; cursor: help; }
  .lag.ok   { color: #4ade80; border-color: #1e3a2a; }
  .lag.warn { color: #fbbf24; border-color: #3a3320; }
  .lag.bad  { color: #f87171; border-color: #3a2426; }
  .hint { color: #8b909a; font-size: 13px; }
  .segs { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; max-height: 46vh;
          overflow: auto; border: 1px solid #23262d; border-radius: 10px; padding: 6px; }
  .seg { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: 7px;
         cursor: pointer; font-size: 14px; }
  .seg:hover { background: #14171c; }
  .seg.playing { background: #1e293b; color: #93c5fd; }
  .seg .dur { color: #8b909a; font-variant-numeric: tabular-nums; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Camera</h1>
  <div class="tabs">
    <button class="tab active" data-tab="live" id="tab-live">● Live</button>
    <button class="tab" data-tab="rec" id="tab-rec">Recordings</button>
  </div>
  <span class="grow"></span>
  <a class="logout" href="/logout">Sign out</a>
</header>

<main>
  <!-- LIVE -->
  <section id="view-live">
    <video id="live" controls autoplay muted playsinline></video>
    <div class="row">
      <button class="btn golive" id="golive" onclick="goLive()">● LIVE</button>
      <span class="lag" id="lag">— s behind</span>
      <span class="hint">Age of the frame on screen. You can scrub back; click LIVE to jump to the edge.</span>
    </div>
  </section>

  <!-- RECORDINGS -->
  <section id="view-rec" class="hidden">
    <video id="player" controls playsinline></video>
    <div class="row">
      <input type="date" id="date" />
      <button class="btn" id="load">Load day</button>
      <span class="hint" id="recinfo"></span>
    </div>
    <div class="segs" id="segs"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const liveVideo = $("#live");
const player = $("#player");

// ---------- tabs ----------
let hls = null;
function startLive() {
  const src = "/live/index.m3u8";
  // ORDER MATTERS, and the intuitive order is wrong.
  //
  // This used to test canPlayType() first and only fall back to hls.js. But
  // canPlayType("application/vnd.apple.mpegurl") returns "maybe" on Android
  // Chrome as well as on Safari, so nearly every browser took the native path
  // and hls.js never loaded at all — which quietly disabled every low-latency
  // setting below, since the native player has no latency controller.
  //
  // That is what made the lag GROW the longer the page stayed open: native HLS
  // plays at exactly 1.0x from wherever it happens to be, so every stall or slow
  // segment is added to the delay permanently and nothing ever claws it back.
  // Minutes in, it was 6s and still climbing.
  //
  // So: prefer hls.js wherever it works (it reports MediaSource *and*
  // iOS 17.1+ ManagedMediaSource), and keep native strictly as the fallback for
  // players that have no MSE at all — mainly older iPhones.
  if (window.Hls && Hls.isSupported()) {
    if (hls) hls.destroy();
    hls = new Hls({
      lowLatencyMode: true,
      // Target latency, in SECONDS. Two traps here, both worth knowing.
      //
      // 1. hls.js has two mutually exclusive config families — seconds
      //    (liveSyncDuration/liveMaxLatencyDuration) and segment counts
      //    (liveSyncDurationCount/liveMaxLatencyDurationCount). Mixing them is
      //    fatal rather than ignored: `new Hls()` THROWS "don't mix up ...",
      //    leaving hls null and the player black. Pick one family; this is the
      //    seconds one, so never add a *Count key alongside these.
      //
      // 2. Setting either sync key at all makes hls.js discard the playlist's
      //    PART-HOLD-BACK (0.335s here):
      //
      //      let targetLatency = lowLatencyMode ? partHoldBack || holdBack : …;
      //      if (… || userConfig.liveSyncDuration || userConfig.liveSyncDurationCount …)
      //        targetLatency = liveSyncDuration ?? liveSyncDurationCount * targetduration;
      //
      //    That is how the old `liveSyncDurationCount: 2` parked us >=2s behind
      //    the edge — 2 x EXT-X-TARGETDURATION, which is an integer number of
      //    seconds — instead of the 0.335s the server advertises.
      //
      // Inheriting PART-HOLD-BACK by setting neither key looks like the clean
      // answer, but liveMaxLatencyDurationCount then defaults to Infinity, so
      // there is no upper bound at all; and catch-up only engages within
      // `targetLatency + targetduration` (~1.3s). One stall past that and it
      // drifts forever with nothing to pull it back.
      //
      // So: pick both explicitly. 0.8s is comfortable headroom over 0.335s,
      // giving a 1.8s catch-up window, and 4s is a hard ceiling that forces a
      // jump forward rather than an unbounded slide.
      liveSyncDuration: 0.8,
      liveMaxLatencyDuration: 4,
      // Per-stall penalty. hls.js defaults this to a FULL SECOND, capped at
      // targetduration — so with 1s segments, a single stall anywhere in the
      // session pushed targetLatency from 0.8 straight to 1.8 and pinned it
      // there: stallCount only resets in onManifestLoading, i.e. on a page
      // reload, never on recovery. That alone was most of the observed 3-4s.
      //
      // 0.2 still backs off when the network genuinely can't hold the target
      // (which is the point of the mechanism) but makes one hiccup cost 200ms
      // instead of a second, and takes 5 stalls rather than 1 to saturate.
      liveSyncOnStallIncrease: 0.2,
      // Nudge playback up to 1.05x to close a small gap rather than jumping,
      // which is far less jarring than a seek on a live view.
      maxLiveSyncPlaybackRate: 1.05,
      liveDurationInfinity: true,    // treat the seek bar as a true live stream
      backBufferLength: 30,
      // Send the session cookie on every request (hls.js omits creds by default).
      xhrSetup: (xhr) => { xhr.withCredentials = true; },
      fetchSetup: (context, init) => {
        init.credentials = "include";
        return new Request(context.url, init);
      },
    });
    hls.loadSource(src);
    hls.attachMedia(liveVideo);
    // Jump to the live edge ONCE when it first starts — but never again, so you
    // can freely scrub back into the buffered window without being yanked forward.
    hls.once(Hls.Events.FRAG_BUFFERED, goLive);
  } else if (liveVideo.canPlayType("application/vnd.apple.mpegurl")) {
    liveVideo.src = src;                       // native HLS (older iOS, no MSE)
    liveVideo.addEventListener("loadedmetadata", goLive, { once: true });
    startDriftWatch();                         // native has no catch-up of its own
  } else {
    $("#view-live").insertAdjacentHTML("beforeend", "<p class=hint>HLS unsupported in this browser.</p>");
  }
}
function stopLive() {
  if (hls) { hls.destroy(); hls = null; }
  stopDriftWatch();
  liveVideo.removeAttribute("src"); liveVideo.load();
}

// ---------- native-HLS drift watchdog ----------
// Only for the native fallback. hls.js corrects drift by itself (that is what
// maxLiveSyncPlaybackRate/liveMaxLatencyDuration are for); the native player
// does not, so without this the delay grows without limit for as long as the
// page is open.
//
// It must not fight the user: scrubbing back into the buffer is a feature here,
// so a manual seek disarms the watchdog until "LIVE" is clicked again. We can
// tell our own seeks from the user's with a flag, since both fire `seeked`.
let driftTimer = null, userScrubbed = false, ourSeek = false;
const DRIFT_MAX = 3.0;      // let it wander this far behind the edge...
const DRIFT_TARGET = 1.0;   // ...then put it back here

liveVideo.addEventListener("seeked", () => {
  if (ourSeek) { ourSeek = false; return; }
  userScrubbed = true;      // re-armed by goLive()
});

function startDriftWatch() {
  stopDriftWatch();
  driftTimer = setInterval(() => {
    if (userScrubbed || liveVideo.paused || liveVideo.seeking) return;
    const s = liveVideo.seekable;
    if (!s || !s.length) return;
    const edge = s.end(s.length - 1);
    if (edge - liveVideo.currentTime > DRIFT_MAX) {
      ourSeek = true;
      liveVideo.currentTime = edge - DRIFT_TARGET;
    }
  }, 2000);
}
function stopDriftWatch() { if (driftTimer) { clearInterval(driftTimer); driftTimer = null; } }

// Jump to the live edge (used by the "Go Live" button and on load).
function goLive() {
  const v = liveVideo;
  userScrubbed = false;   // clicking LIVE re-arms the native drift watchdog
  try {
    let target = null;
    if (hls && typeof hls.liveSyncPosition === "number" && isFinite(hls.liveSyncPosition)) {
      target = hls.liveSyncPosition;
    } else if (v.seekable && v.seekable.length) {
      target = v.seekable.end(v.seekable.length - 1);
    }
    // Never seek past what is actually buffered. With LL-HLS the sync position
    // sits only ~0.5s from the edge, so on the very first fragment it can land
    // beyond the buffer — and a video element parked in a hole just shows black
    // forever, with no error and no recovery. Clamp into the buffered range.
    if (target !== null && v.buffered && v.buffered.length) {
      const end = v.buffered.end(v.buffered.length - 1);
      const start = v.buffered.start(0);
      target = Math.max(start, Math.min(target, end - 0.1));
    }
    if (target !== null && isFinite(target) && target >= 0) { ourSeek = true; v.currentTime = target; }
    v.play().catch(() => {});
  } catch (e) {}
}

// Show how far behind live we REALLY are.
//
// Order matters, and the obvious choice is the wrong one. hls.latency looks
// authoritative but is only `(levelDetails.edge + age) - currentTime` — the
// distance from the PLAYLIST edge. It is blind to every hop upstream of the
// packager (camera, capture box, SRT, transcode), so it happily reads ~1s while
// the picture on screen is three seconds old. Preferring it also made the
// PROGRAM-DATE-TIME branch below dead code, since it is ~always > 0 once
// playing. So: wall clock first, hls.latency only as a last resort, clearly
// labelled as the weaker measurement.
function trueLatency() {
  // MediaMTX stamps EXT-X-PROGRAM-DATE-TIME on every segment, so this is the
  // real capture time of the frame being shown — true glass-to-glass, minus
  // only the camera's own internal delay.
  if (hls) {
    const d = hls.playingDate;
    if (d instanceof Date && !isNaN(d)) return { s: (Date.now() - d.getTime()) / 1000, real: true };
    if (typeof hls.latency === "number" && isFinite(hls.latency) && hls.latency > 0) {
      return { s: hls.latency, real: false };
    }
    return null;
  }
  // Native HLS: same idea via the standard getStartDate(), where it exists.
  // Safari has it; Android Chrome does not, which is why this used to come back
  // empty and the badge sat on "— s behind" forever.
  if (typeof liveVideo.getStartDate === "function") {
    const start = liveVideo.getStartDate();
    if (start instanceof Date && !isNaN(start) && liveVideo.currentTime > 0) {
      return { s: (Date.now() - (start.getTime() + liveVideo.currentTime * 1000)) / 1000, real: true };
    }
  }
  // Last resort: distance from the seekable edge. Edge-relative, not wall clock,
  // so it under-reports by the pipeline delay — but it is a real number, and it
  // still shows drift growing, which is the failure worth seeing.
  const s = liveVideo.seekable;
  if (s && s.length && liveVideo.currentTime > 0) {
    return { s: s.end(s.length - 1) - liveVideo.currentTime, real: false };
  }
  return null;
}

// The readout is its own element next to the button, not the button's label, so
// it is on screen at all times — including while paused, scrubbed back, or
// still connecting — instead of only when a number happens to be available.
function updateLiveLag() {
  const btn = $("#golive"), out = $("#lag");
  if (!out || $("#view-live").classList.contains("hidden")) return;
  const r = trueLatency();
  if (r == null || !isFinite(r.s)) {
    out.textContent = "— s behind";
    out.className = "lag";
    if (btn) btn.classList.remove("behind");
    return;
  }
  // Clamp: a negative reading just means the client's clock is ahead of the
  // server's, which is a clock-sync artefact and not something to show.
  const lag = Math.max(0, r.s);
  out.textContent = `${lag.toFixed(1)}s behind` + (r.real ? "" : " (edge)");
  out.className = "lag " + (lag <= 1.5 ? "ok" : lag <= 3 ? "warn" : "bad");
  out.title = r.real
    ? "Wall-clock age of the frame on screen, from EXT-X-PROGRAM-DATE-TIME."
    : "Distance from the playlist edge only — excludes camera/capture/transcode delay.";
  if (btn) btn.classList.toggle("behind", lag > 3);
}
// 500ms: fast enough that the number tracks a Go-live jump instead of lagging
// a second behind the thing it is measuring.
setInterval(updateLiveLag, 500);

document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
  t.classList.add("active");
  const live = t.dataset.tab === "live";
  $("#view-live").classList.toggle("hidden", !live);
  $("#view-rec").classList.toggle("hidden", live);
  if (live) { startLive(); } else { stopLive(); if (!$("#segs").dataset.loaded) loadDay(); }
}));

// ---------- recordings ----------
const dateEl = $("#date");
dateEl.value = new Date().toISOString().slice(0, 10);
let segments = [];
let playingIdx = -1;

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function fmtDur(s) {
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return m ? `${m}m ${sec}s` : `${sec}s`;
}

async function loadDay() {
  const date = dateEl.value;
  $("#recinfo").textContent = "Loading…";
  $("#segs").dataset.loaded = "1";
  try {
    const res = await fetch(`/api/recordings?date=${date}`);
    segments = await res.json();
  } catch { segments = []; }
  const list = $("#segs");
  list.innerHTML = "";
  if (!segments.length) {
    $("#recinfo").textContent = "No recordings for this day.";
    return;
  }
  const total = segments.reduce((a, s) => a + s.duration, 0);
  $("#recinfo").textContent = `${segments.length} segment(s), ${fmtDur(total)} total`;
  segments.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "seg";
    row.innerHTML = `<span>${fmtTime(s.start)}</span><span class="dur">${fmtDur(s.duration)}</span>`;
    row.addEventListener("click", () => play(i));
    list.appendChild(row);
  });
}

function play(i) {
  if (i < 0 || i >= segments.length) return;
  playingIdx = i;
  document.querySelectorAll(".seg").forEach((el, idx) => el.classList.toggle("playing", idx === i));
  player.src = segments[i].url;
  player.play().catch(() => {});
  player.scrollIntoView({ behavior: "smooth", block: "start" });
}

// Auto-advance to the next segment for continuous playback.
player.addEventListener("ended", () => { if (playingIdx + 1 < segments.length) play(playingIdx + 1); });
$("#load").addEventListener("click", loadDay);

// Boot into live.
startLive();
</script>
</body>
</html>
