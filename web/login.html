<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Camera · sign in</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0d0f12; color: #e7e9ee;
         font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  form { width: min(340px, 90vw); padding: 28px; border: 1px solid #23262d;
         border-radius: 14px; background: #14171c; }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p.sub { margin: 0 0 20px; color: #8b909a; font-size: 13px; }
  input { width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid #2b2f37;
          background: #0d0f12; color: #e7e9ee; font-size: 15px; }
  button { width: 100%; margin-top: 12px; padding: 11px; border: 0; border-radius: 9px;
           background: #3b82f6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #2f6fe0; }
  .err { margin-top: 12px; color: #f87171; font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Camera access</h1>
    <p class="sub">Enter the shared password to continue.</p>
    <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <div class="err"><!--ERR--></div>
  </form>
</body>
</html>
